name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: |
          python -m py_compile plugins/claude-code-monitor/src/claude-code-monitor.py
          python -m py_compile plugins/claude-code-monitor/src/write-state.py
          python -m py_compile plugins/claude-code-monitor/src/codex_rollout_poller.py
          python -m py_compile install.py
          python -m py_compile uninstall.py
          python -m py_compile plugins/claude-code-monitor/install.py
          python -m py_compile plugins/claude-code-monitor/uninstall.py
          python -m py_compile scripts/bump-version.py

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest discover -s tests

  version-check:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify monitor version is valid
        run: |
          python3 -c "
          import re, sys

          with open('plugins/claude-code-monitor/src/claude-code-monitor.py') as f:
              m = re.search(r'^__version__\s*=\s*\"([^\"]+)\"', f.read(), re.MULTILINE)
              v_py = m.group(1) if m else None

          print(f'claude-code-monitor.py: {v_py}')

          if not v_py or not re.match(r'^\\d+\\.\\d+\\.\\d+$', v_py):
              print('ERROR: Invalid or missing version!', file=sys.stderr)
              sys.exit(1)
          print('Version is valid.')
          "

  changelog-check:
    name: CHANGELOG version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CHANGELOG has current version
        run: |
          VER=$(python3 -c "import re; print(re.search(r'^__version__\\s*=\\s*\"([^\"]+)\"', open('plugins/claude-code-monitor/src/claude-code-monitor.py').read(), re.MULTILINE).group(1))")
          grep -q "## \[${VER}\]" CHANGELOG.md || { echo "CHANGELOG.md missing entry for v${VER}"; exit 1; }

  json-check:
    name: JSON validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          python -c "
          import json, glob, sys
          errors = 0
          for f in glob.glob('**/*.json', recursive=True):
              try:
                  with open(f) as fh:
                      json.load(fh)
                  print(f'  OK: {f}')
              except json.JSONDecodeError as e:
                  print(f'  FAIL: {f} — {e}')
                  errors += 1
          sys.exit(errors)
          "
